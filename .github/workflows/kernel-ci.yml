name: Kernel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  regression:
    name: Build & QEMU Headless Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Install bootimage
        run: cargo install bootimage

      - name: Ensure disk image exists
        run: |
          if [ ! -f disk.img ] || [ ! -s disk.img ]; then
            dd if=/dev/zero of=disk.img bs=1M count=64
          fi

      - name: Check architectural module dependency boundaries
        run: ./tools/check_deps.sh

      - name: Verify headless build (no default features)
        run: |
          cargo check -p sparkos --no-default-features --verbose 2>&1 | tee /tmp/check.log || {
            echo "### Cargo Check Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/check.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build bootimage with kernel-regression
        run: |
          cargo bootimage --package sparkos --features kernel-regression 2>&1 | tee /tmp/bootimage.log || {
            echo "### Bootimage Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/bootimage.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Run QEMU headless regression smoke test
        run: |
          python3 tools/qemu_smoke.py \
            --image target/x86_64-unknown-none/debug/bootimage-sparkos.bin \
            --disk disk.img \
            --output scratch/ci_test \
            --regression

      - name: Verify regression golden log matches
        run: |
          grep "\[REGRESSION\] PASS" scratch/ci_test/serial.log > current_regression.log
          echo "Current regression passes:"
          cat current_regression.log
          grep "\[REGRESSION\] ALL PASS" scratch/ci_test/serial.log

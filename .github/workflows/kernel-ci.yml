name: Kernel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  regression:
    name: Build & QEMU Headless Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils libslirp0 python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-08
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Install bootimage
        run: cargo install bootimage

      - name: Ensure disk image exists
        run: |
          if [ ! -f disk.img ] || [ ! -s disk.img ]; then
            dd if=/dev/zero of=disk.img bs=1M count=64
          fi

      - name: Check architectural module dependency boundaries
        run: ./tools/check_deps.sh

      - name: Verify headless build (no default features)
        run: |
          cargo check -p sparkos --no-default-features --verbose 2>&1 | tee /tmp/check.log || {
            echo "### Cargo Check Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/check.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Build bootimage with kernel-regression
        run: |
          set -o pipefail
          cargo bootimage --manifest-path kernel/Cargo.toml --features kernel-regression 2>&1 | tee /tmp/bootimage.log || {
            ERR=$(grep -B 2 -A 5 "error\[" /tmp/bootimage.log 2>/dev/null | head -n 10 | tr '\n' ' ')
            if [ -z "$ERR" ]; then
              ERR=$(grep -B 2 -A 5 "error:" /tmp/bootimage.log 2>/dev/null | head -n 10 | tr '\n' ' ')
            fi
            echo "::error::Bootimage error: $ERR"
            exit 1
          }
          echo "Bootimage Log:"
          cat /tmp/bootimage.log
          echo "Created binaries:"
          find target -name "*.bin" || true

      - name: Run QEMU headless regression smoke test
        run: |
          BIN_PATH=$(find target kernel/target -name "bootimage-*.bin" 2>/dev/null | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "::error::No bootimage binary found in target directories"
            exit 1
          fi
          echo "Using bootimage: $BIN_PATH"
          python3 tools/qemu_smoke.py \
            --image "$BIN_PATH" \
            --disk disk.img \
            --output scratch/ci_test \
            --regression \
            --timeout 180 || {
              ERR=$(head -n 5 scratch/ci_test/qemu.log 2>/dev/null | tr '\n' ' ')
              echo "::error::QEMU failed: $ERR"
              echo "### QEMU Log:"
              cat scratch/ci_test/qemu.log 2>/dev/null || true
              echo "### Serial Log (tail):"
              tail -n 100 scratch/ci_test/serial.log 2>/dev/null || true
              exit 1
            }

      - name: Verify regression golden log matches
        run: |
          grep "\[REGRESSION\] PASS" scratch/ci_test/serial.log > current_regression.log
          echo "Current regression passes:"
          cat current_regression.log
          grep "\[REGRESSION\] ALL PASS" scratch/ci_test/serial.log

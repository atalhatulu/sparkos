[package]
name = "sparkos"
version = "0.1.0"
edition = "2021"

[features]
kernel-regression = []
perf-metrics = []
bench = []

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory", "recursive_page_table"] }
x86_64 = "0.15"
uart_16550 = "0.2"
spin = { version = "0.9", features = ["once", "rwlock", "mutex", "spin_mutex"] }
crossbeam-queue = { version = "0.3.8", default-features = false, features = ["alloc"] }
linked_list_allocator = "0.10"

[package.metadata.bootimage]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={}", "-serial", "stdio", "-m", "256M", "-enable-kvm"]

# The desktop performs CPU rasterization; unoptimized dev loops are unsuitable
# for interactive use. Keep debug information and runtime correctness checks.
[profile.dev]
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true
